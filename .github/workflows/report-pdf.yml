name: Report PDF visual verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'remote-browser-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Generate and verify the real sample PDF
        run: node tests/report-pdf.visual.check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11ylens-sample-report
          path: artifacts/a11ylens-sample-report.pdf
          if-no-files-found: ignore
