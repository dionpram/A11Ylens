name: Isolated scanner integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-isolation:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'secure-worker-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCAN_WORKER_TOKEN: "ci-local-token-only-123456789012345678901234567890"
    steps:
      - uses: actions/checkout@v4
      - name: Confirm compose structure
        run: docker compose -f compose.secure.yaml config --quiet
      - name: Build and launch two isolated containers
        run: docker compose -f compose.secure.yaml up --build --detach --wait --wait-timeout 180
      - name: Verify live network isolation
        run: docker compose -f compose.secure.yaml exec -T scanner node security/check-network.mjs
      - name: Check real public HTTPS URL with axe-core in isolated worker
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          const response = await fetch('http://127.0.0.1:3001/api/scan', {
            method:'POST',
            headers:{
              'Content-Type':'application/json',
              'x-a11ylens-worker-token':process.env.SCAN_WORKER_TOKEN,
              'x-a11ylens-visitor-id':'aabbccddeeff001122334455'
            },
            body:JSON.stringify({url:'https://example.com/'}),
            signal:AbortSignal.timeout(55_000)
          });
          const body=await response.json();
          assert.equal(response.status,200, 'Scanner HTTP '+response.status+': '+(body?.code||body?.error||'no report'));
          assert.equal(body.environment?.engine,'axe-core');
          assert.ok(Array.isArray(body.passes)&&Array.isArray(body.failures));
          assert.ok(typeof body.id==='string');
          console.log('PASS: isolated worker returned real axe-core findings for example.com');
          EOF
      - name: Show sanitized service status on failure
        if: failure()
        run: docker compose -f compose.secure.yaml ps
      - name: Always stop isolated workers
        if: always()
        run: docker compose -f compose.secure.yaml down --timeout 10
