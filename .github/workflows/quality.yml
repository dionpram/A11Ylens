name: Quality checks

on:
  push:
    branches: [main, remote-browser-beta]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build web app
        run: npm run build
      - name: Assert scanner runtime assets are included
        run: node tests/scan-trace.check.mjs
      - name: Install Chromium for scanner smoke test
        run: npx playwright install --with-deps chromium
      - name: Verify real scan against controlled fixture
        run: npm run test:e2e
      - name: Install PDF inspection utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Verify redesigned A4 PDF export
        run: node tests/report-pdf.visual.check.mjs
      - name: Save sample report for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11ylens-pdf-preview
          path: artifacts/a11ylens-sample-report.pdf
          if-no-files-found: ignore
