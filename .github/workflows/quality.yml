name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate isolated Docker Compose topology
        env:
          SCAN_WORKER_TOKEN: "ci-only-placeholder-12345678901234567890"
        run: docker compose -f compose.secure.yaml config --quiet
      - name: Run unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build web app
        run: npm run build
      - name: Install Chromium for scanner smoke test
        run: npx playwright install --with-deps chromium
      - name: Verify real scan against controlled fixture
        run: npm run test:e2e
